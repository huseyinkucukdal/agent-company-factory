[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company-factory"
version = "0.1.0"
description = "Platform for spawning and operating autonomous AI-agent companies."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "structlog>=24.1",
    "python-ulid>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "bcrypt>=4.0,<5",
    "anyio>=4.4",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "mypy>=1.8",
    "ruff>=0.3",
    "httpx>=0.27",
]
llm-openai = [
    "openai>=1.40",
]
llm-anthropic = [
    "anthropic>=0.40",
]
llm-all = [
    "openai>=1.40",
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules", "modules.*"]
exclude = ["**.tests", "**.tests.*"]

[tool.setuptools.package-data]
"modules.cost" = ["pricing.toml"]
"modules.storage.migrations.board" = ["*.sql"]
"modules.storage.migrations.company" = ["*.sql"]
"modules.event_store.migrations" = ["*.sql"]
"modules.clock.migrations" = ["*.sql"]
"modules.identity.migrations" = ["*.sql"]
"modules.cost.migrations" = ["*.sql"]
"modules.approvals.migrations" = ["*.sql"]
"modules.memory.migrations" = ["*.sql"]
"modules.board_api.migrations" = ["*.sql"]
"modules.factory.migrations" = ["*.sql"]
"modules.inter_company.migrations" = ["*.sql"]
"modules.efficiency.migrations" = ["*.sql"]
"modules.performance.migrations" = ["*.sql"]
"modules.llm.migrations.company" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["modules"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore:'crypt' is deprecated.*:DeprecationWarning",
    "ignore:.*crypt.*:DeprecationWarning:passlib",
    # Async-heavy suites leak the occasional unclosed socket/event loop
    # via GC across tests; surface them as warnings, not errors.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["modules"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "S101"]
# Domain-meaningful exception names without the generic *Error suffix.
"modules/storage/exceptions.py" = ["N818"]
"modules/event_store/exceptions.py" = ["N818"]
"modules/clock/exceptions.py" = ["N818"]
"modules/identity/exceptions.py" = ["N818"]
"modules/cost/exceptions.py" = ["N818"]
"modules/approvals/exceptions.py" = ["N818"]
"modules/memory/exceptions.py" = ["N818", "A001"]
"modules/memory/__init__.py" = ["A004"]
"modules/tools/exceptions.py" = ["N818"]
"modules/tools/__init__.py" = ["A004"]
"modules/connector/exceptions.py" = ["N818"]
"modules/connector/__init__.py" = ["A004"]
"modules/efficiency/exceptions.py" = ["N818"]
"modules/efficiency/detectors/*.py" = ["RUF001"]
"modules/orchestrator/orchestrator.py" = ["RUF001"]
"modules/agent_runtime/persona_loader.py" = ["RUF001"]
"modules/agent_runtime/turn.py" = ["RUF001"]
"modules/board_api/routes/efficiency.py" = ["B008"]
"modules/agent_runtime/exceptions.py" = ["N818"]
"modules/orchestrator/exceptions.py" = ["N818"]
"modules/security_agent/exceptions.py" = ["N818"]
"modules/factory/exceptions.py" = ["N818"]
"modules/board_api/exceptions.py" = ["N818"]
[tool.mypy]
python_version = "3.11"
strict = true
files = ["modules"]
exclude = ["data/", "build/"]

[[tool.mypy.overrides]]
module = "modules.*.tests.*"
disallow_untyped_defs = false
